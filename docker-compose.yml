# Local/staging stack. In production put a TLS-terminating reverse proxy (Caddy/nginx) in front: HTTPS + WSS.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: astra
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U astra"], interval: 5s, retries: 10 }
  game:
    build: .
    environment:
      PORT: 8080
      DATABASE_URL: postgres://astra:${POSTGRES_PASSWORD:-change_me}@db:5432/astra
    ports: ["8080:8080"]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
volumes:
  dbdata:
